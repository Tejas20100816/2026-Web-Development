<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
  <body>
    <!-- Example of an image from external source
        <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png">
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
      <h1>External Source Images</h1>
      <hr>

    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
      <img src="https://c02.purpledshub.com/uploads/sites/62/2019/10/Federico_Veronesi_Lions-cover-image-e359a4e.jpg?webp=1&w=1200" height="250" width="250">

    <!-- Challenge 3: Add three more of the same image.  Change the width and height of each image to 
     be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
      <img src="https://c02.purpledshub.com/uploads/sites/62/2019/10/Federico_Veronesi_Lions-cover-image-e359a4e.jpg?webp=1&w=1200" height="200" width="200">
      <img src="https://c02.purpledshub.com/uploads/sites/62/2019/10/Federico_Veronesi_Lions-cover-image-e359a4e.jpg?webp=1&w=1200" height="150" width="150">
      <img src="https://c02.purpledshub.com/uploads/sites/62/2019/10/Federico_Veronesi_Lions-cover-image-e359a4e.jpg?webp=1&w=1200" height="100" width="100">
      <hr>
  <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png">
  -->
  <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
    <h1>Internal Source Images</h1>
    <hr>

  <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
    <img src="HulkLogo2.jpg">
    <hr>
  <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png">
  -->  

  <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
    <h1>Internal Images Inside Folders</h1>

  <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. 
                   Both images are located in the images folder to the page -->
                   <img src="images/HulkSmash2.png" height="250">
                   <img src="images/HulkSmash3.jpg" height="250">

  <hr>
  <!-- Challenge Bonus: Create a heading with "Marvel Superheroes".  Add a horizontal rule.  
   Add five images of Marvel Superheroes.  Make them all the same size -->
   <h1>Marvel Superheros</h1>
   <hr>
   <img src="https://static.wikia.nocookie.net/spiderman-films/images/b/be/Tom_Holland_Spidey_Suit.webp/revision/latest/scale-to-width-down/1200?cb=20230914135801" height="250" width="250">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSoYc3I85MN4xPh4WJar1TitucCxVTX49kqK7rqGfDCnLp5JgoEz5PS-Yo&s=10" height="250" width="250">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyakeIASWVjwUcQUmyVfUh9ZX_lCjPUKuhCyziJkQSeA&s=10" height="250" width="250">
   <img src="https://static.wikia.nocookie.net/marvelcinematicuniverse/images/2/2b/Thor_Infobox.jpg/revision/latest?cb=20231021012616" height="250" width="250">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOBTeBas-m1qL6E4MzJFKtmQ0S2UnNoANSNSUmkv8wyg&s=10" height="250" width="250">


  </body>
</html>
